name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      MONGO_URL: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4

      # Transactions need a replica set, which service containers can't configure,
      # so start a single-node replica set directly.
      - name: Start MongoDB replica set
        # Output is captured rather than piped into `grep -q`: under bash -eo pipefail an
        # early-exiting grep can fail the pipeline even when the check succeeded.
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            state=$(docker exec mongo mongosh --quiet --eval '
              try { rs.status().members[0].stateStr }
              catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}); "INITIATED" }' 2>&1 || true)
            echo "attempt $i: $state"
            if [ "$state" = "PRIMARY" ]; then exit 0; fi
            sleep 2
          done
          docker logs mongo | tail -50
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[test]' motor

      - name: Test
        run: pytest -q
